<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sheikh x Flappy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <div class="screen-wrapper">
    <div class="game-box">
      <!-- റിയൽടൈം സ്കോർ -->
      <div id="live-score" class="hidden">0</div>

      <canvas id="flappyCanvas" width="360" height="640"></canvas>

      <!-- യഥാർത്ഥ സ്റ്റാർട്ട് ഹോം സ്ക്രീൻ -->
      <div id="home-overlay" class="panel-overlay">
        <div class="home-top-bar">
          <div class="user-chip" id="btn-edit-name">
            <span id="display-name">Player123</span>
            <span class="edit-icon">✏️</span>
          </div>
          <div class="top-high-score">
            <span class="score-num" id="top-high-num">0</span>
            <span class="score-lbl">HIGH SCORE</span>
          </div>
        </div>

        <div class="home-center">
          <div class="brand-title">
            <h2>FLAPPY x SHEIKH</h2>
          </div>
          <div class="tap-instruction">
            <div class="finger-anim">👆</div>
            <div class="pixel-tag">TAP TO FLY</div>
          </div>
        </div>
      </div>

      <!-- പേര് മാറ്റാനുള്ള പോപ്പ്അപ്പ് -->
      <div id="name-modal" class="panel-overlay hidden">
        <div class="retro-card modal-box">
          <h3 class="modal-title">Edit your name</h3>
          <p class="modal-sub">Shown on the leaderboard</p>
          <input type="text" id="input-username" maxlength="12" value="Player123">
          <button id="btn-save-name" class="pixel-btn">OK</button>
        </div>
      </div>

      <!-- ഗെയിം ഓവർ സ്കോർ ബോർഡ് -->
      <div id="gameover-overlay" class="panel-overlay hidden">
        <div class="gameover-container">
          <h2 class="gameover-banner">GAME OVER</h2>
          
          <!-- ലീഡർബോർഡ് ടാബുകൾ -->
          <div class="tab-header">
            <button id="tab-score" class="tab-btn active">SCORE</button>
            <button id="tab-daily" class="tab-btn">DAILY</button>
            <button id="tab-alltime" class="tab-btn">ALL TIME</button>
          </div>

          <!-- സ്കോർ കാർഡ് -->
          <div id="score-view" class="retro-board">
            <div class="board-top-section">
              <div class="score-box">
                <span class="board-label">SCORE</span>
                <span id="final-score" class="board-num">0</span>
              </div>
              <div class="score-box">
                <span class="board-label">HIGH SCORE</span>
                <span id="final-best" class="board-num">0</span>
              </div>
            </div>

            <!-- നിങ്ങൾ ചോദിച്ച വിവരണം സ്കോർ ബോക്സിനകത്ത് -->
            <div class="board-desc-box">
              <p>This is a Flappy Bird-style game—specifically, a 'Sheikh x Flappy' type game.</p>
              <small>Created by <span>@STATE_.TROOPER</span></small>
            </div>

            <div class="board-bottom-section">
              <span class="board-label">MEDAL</span>
              <div class="medal-avatar">
                <img src="photo.png" alt="Player" onerror="this.src='https://api.iconify.design/pixelarticons:avatar.svg'">
              </div>
            </div>
          </div>

          <!-- റാങ്ക് ലിസ്റ്റ് -->
          <div id="rank-view" class="retro-board hidden">
            <div class="rank-list" id="rank-content"></div>
          </div>

          <button id="btn-replay" class="pixel-btn play-again-btn">PLAY AGAIN</button>
        </div>
      </div>
    </div>
  </div>

  <!-- മ്യൂസിക് ഫയലുകൾ -->
  <audio id="jump-1" src="jump1.mp3" preload="auto"></audio>
  <audio id="jump-2" src="jump2.mp3" preload="auto"></audio>
  <audio id="score-1" src="score1.mp3" preload="auto"></audio>
  <audio id="score-2" src="score2.mp3" preload="auto"></audio>
  <audio id="score-3" src="score3.mp3" preload="auto"></audio>
  <audio id="hit-1" src="hit1.mp3" preload="auto"></audio>
  <audio id="hit-2" src="hit2.mp3" preload="auto"></audio>
  <audio id="hit-3" src="hit3.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
