<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sheikh x Flappy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <div class="screen-wrapper">
    <div class="game-box">
      <!-- റിയൽ-ടൈം സ്കോർ ഡിസ്പ്ലേ -->
      <div id="live-score">0</div>

      <!-- കാൻവാസ് -->
      <canvas id="flappyCanvas" width="360" height="600"></canvas>

      <!-- ആരംഭ മെനു -->
      <div id="menu-overlay" class="panel-overlay">
        <div class="retro-card">
          <h1 class="main-title">Sheikh x Flappy</h1>
          <p class="desc-text">
            This is a Flappy Bird-style game—specifically, a 'Sheikh x Flappy' type game.
          </p>
          <div class="profile-preview">
            <img src="photo.png" alt="Profile" onerror="this.src='https://api.iconify.design/pixelarticons:avatar.svg'">
          </div>
          <p class="credit-tag">Created by <span>@STATE_.TROOPER</span></p>
          <button id="btn-enter" class="pixel-btn play-btn">ENTER TO GAME</button>
        </div>
      </div>

      <!-- ഒറിജിനൽ ഗെയിം ഓവർ സ്കോർബോർഡ് കാർഡ് -->
      <div id="gameover-overlay" class="panel-overlay hidden">
        <div class="gameover-card">
          <h2 class="gameover-banner">GAME OVER</h2>
          <div class="score-board">
            <div class="board-top">
              <div class="score-col">
                <span class="label">SCORE</span>
                <span id="score-val" class="num">0</span>
              </div>
              <div class="score-col">
                <span class="label">HIGH SCORE</span>
                <span id="best-val" class="num">0</span>
              </div>
            </div>
            
            <div class="board-bottom">
              <span class="label">MEDAL</span>
              <!-- നിങ്ങൾ ചോദിച്ച വട്ടത്തിലുള്ള ഫോട്ടോ മെഡൽ ബോക്സിൽ വരുന്നു -->
              <div class="medal-circle">
                <img src="photo.png" alt="Medal" onerror="this.src='https://api.iconify.design/pixelarticons:avatar.svg'">
              </div>
            </div>
          </div>

          <!-- റിവൈവ് ഒഴിവാക്കി പ്ലേ എഗൈൻ ബട്ടൺ മാത്രം -->
          <button id="btn-replay" class="pixel-btn play-btn">PLAY AGAIN</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ഓഡിയോകൾ -->
  <audio id="audio-jump-1" src="jump1.mp3" preload="auto"></audio>
  <audio id="audio-jump-2" src="jump2.mp3" preload="auto"></audio>
  <audio id="audio-score-1" src="score1.mp3" preload="auto"></audio>
  <audio id="audio-score-2" src="score2.mp3" preload="auto"></audio>
  <audio id="audio-score-3" src="score3.mp3" preload="auto"></audio>
  <audio id="audio-hit-1" src="hit1.mp3" preload="auto"></audio>
  <audio id="audio-hit-2" src="hit2.mp3" preload="auto"></audio>
  <audio id="audio-hit-3" src="hit3.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
