<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sheikh x Flappy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <div class="screen-wrapper">
    <div class="game-container">
      
      <!-- റിയൽടൈം സ്കോർ -->
      <div id="live-score" class="hidden">0</div>

      <canvas id="flappyCanvas" width="360" height="600"></canvas>

      <!-- 1. ഹോം സ്ക്രീൻ -->
      <div id="home-overlay" class="overlay-layer">
        <div class="home-header">
          <div class="user-chip" id="btn-open-name">
            <span id="disp-username">Player123</span>
            <span class="pencil-icon">✏️</span>
          </div>
          <div class="top-high-box">
            <span class="top-high-num" id="home-best">0</span>
            <span class="top-high-lbl">HIGH SCORE</span>
          </div>
        </div>

        <div class="home-body">
          <h1 class="logo-title">FLAPPY x SHEIKH</h1>
          <div class="tap-area">
            <div class="pixel-hand">👆</div>
            <div class="tap-badge">TAP</div>
          </div>
        </div>
      </div>

      <!-- 2. യൂസർ നെയിം എഡിറ്റ് പോപ്പ്അപ്പ് -->
      <div id="name-modal" class="overlay-layer hidden">
        <div class="pixel-modal">
          <h3>Edit your name</h3>
          <p>Shown on the leaderboard</p>
          <input type="text" id="player-name-input" maxlength="12" value="Player123">
          <button id="btn-save-name" class="pixel-btn">OK</button>
        </div>
      </div>

      <!-- 3. ഒറിജിനൽ ഗെയിം ഓവർ സ്ക്രീൻ -->
      <div id="gameover-overlay" class="overlay-layer hidden">
        <div class="gameover-wrapper">
          <h2 class="gameover-title">GAME OVER</h2>
          
          <div class="tab-controls">
            <button id="tab-score-btn" class="board-tab active">SCORE</button>
            <button id="tab-daily-btn" class="board-tab">DAILY</button>
          </div>

          <!-- സ്കോർ കാർഡ് -->
          <div id="panel-score" class="flappy-board">
            <div class="custom-card-text">
              <p>This is a Flappy Bird-style game—specifically, a 'Sheikh x Flappy' type game.</p>
              <div class="sub-credit">Created by <span>@STATE_.TROOPER</span></div>
            </div>

            <div class="card-stats-row">
              <div class="photo-slot">
                <img src="photo.png" alt="Photo" onerror="this.src='https://api.iconify.design/pixelarticons:avatar.svg'">
              </div>
              <div class="stat-cell">
                <span class="stat-name">SCORE</span>
                <span id="final-score" class="stat-digit">0</span>
              </div>
              <div class="stat-cell">
                <span class="stat-name">HIGH SCORE</span>
                <span id="final-high" class="stat-digit">0</span>
              </div>
            </div>
          </div>

          <!-- ഡെയ്‌ലി റാങ്കിംഗ് കാർഡ് -->
          <div id="panel-daily" class="flappy-board hidden">
            <div class="daily-reset-tag">RESETS IN 18H 20M</div>
            <div class="leaderboard-box" id="daily-list"></div>
          </div>

          <!-- പ്ലേ ബട്ടൺ മാത്രം -->
          <button id="btn-play-again" class="pixel-btn play-action">PLAY</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ഓഡിയോ ടാഗുകൾ -->
  <audio id="snd-jump-1" src="jump1.mp3" preload="auto"></audio>
  <audio id="snd-jump-2" src="jump2.mp3" preload="auto"></audio>
  <audio id="snd-hit-1" src="hit1.mp3" preload="auto"></audio>
  <audio id="snd-hit-2" src="hit2.mp3" preload="auto"></audio>
  <audio id="snd-hit-3" src="hit3.mp3" preload="auto"></audio>
  <audio id="snd-score-1" src="score1.mp3" preload="auto"></audio>
  <audio id="snd-score-2" src="score2.mp3" preload="auto"></audio>
  <audio id="snd-score-3" src="score3.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
