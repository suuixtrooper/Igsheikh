<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sheikh x Flappy</title>
  <link rel="stylesheet" href="style.css">
  <!-- Retro Gaming Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <div class="main-wrapper">
    <div class="game-container">
      <!-- സ്കോർ ബോർഡ് -->
      <div id="score-display">0</div>

      <!-- കാൻവാസ് -->
      <canvas id="gameCanvas" width="360" height="580"></canvas>

      <!-- തുടക്കത്തിലെ മെനു വിൻഡോ -->
      <div id="start-menu" class="modal-overlay">
        <div class="modal-box">
          <div class="modal-content">
            <div class="text-content">
              <h1 class="game-title">Sheikh x Flappy</h1>
              <p class="description">
                This is a Flappy Bird-style game—specifically, a 'Sheikh x Flappy' type game.
              </p>
              <p class="credits">Created by <span>@STATE_.TROOPER</span></p>
            </div>
            <!-- ഫോട്ടോ -->
            <div class="image-box">
              <img src="photo.png" alt="Profile" onerror="this.src='https://api.iconify.design/pixelarticons:avatar.svg'">
            </div>
          </div>

          <button id="start-btn" class="pixel-btn">ENTER TO GAME</button>
        </div>
      </div>

      <!-- ഗെയിം ഓവർ വിൻഡോ -->
      <div id="game-over-screen" class="modal-overlay hidden">
        <div class="modal-box">
          <h2 class="game-over-title">GAME OVER</h2>
          <p class="final-score">Score: <span id="final-score-val">0</span></p>
          <button id="restart-btn" class="pixel-btn">REPLAY</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ജമ്പ് സൗണ്ട് -->
  <audio id="sound-jump" src="jump.mp3" preload="auto"></audio>

  <!-- 3 സ്കോർ സൗണ്ടുകൾ -->
  <audio id="sound-score-1" src="score1.mp3" preload="auto"></audio>
  <audio id="sound-score-2" src="score2.mp3" preload="auto"></audio>
  <audio id="sound-score-3" src="score3.mp3" preload="auto"></audio>

  <!-- 3 ഹിറ്റ്/ഗെയിം ഓവർ സൗണ്ടുകൾ -->
  <audio id="sound-hit-1" src="hit1.mp3" preload="auto"></audio>
  <audio id="sound-hit-2" src="hit2.mp3" preload="auto"></audio>
  <audio id="sound-hit-3" src="hit3.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
